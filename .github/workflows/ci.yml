# Continuous Integration — Polymarket Trading Bot Platform
#
# Runs on every push to `main` and on every PR targeting `main`.
#
# Three parallel/sequential jobs:
#   1. `frontend` — bun install, lint, vitest (junit reporter)
#   2. `backend`  — pip install, pytest (junit XML)
#   3. `build`    — production build (depends on frontend + backend passing)
#
# CI FAILS if any of: lint failure, test failure, or build failure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # required by actions/upload-artifact + test result uploaders

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Frontend (Next.js 16 + TypeScript + Vitest)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 20 (for tooling / cache)
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      - name: Test (vitest with junit reporter)
        run: |
          mkdir -p test-results/vitest
          bun run test -- \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results/vitest/junit.xml
        continue-on-error: false

      - name: Upload vitest junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/vitest/
          if-no-files-found: warn
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Backend (Python 3.12 — Polymarket Bot service)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mini-services/polymarket-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mini-services/polymarket-bot/requirements.txt
            mini-services/polymarket-bot/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only deps (pytest is in requirements.txt but be defensive)
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: |
          mkdir -p test-results/pytest
          python -m pytest tests/ \
            --tb=short \
            -q \
            --junitxml=test-results/pytest/junit.xml

      - name: Upload pytest junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: mini-services/polymarket-bot/test-results/pytest/
          if-no-files-found: warn
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build (production build — gated on frontend + backend passing)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 20 (cache)
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Next.js standalone)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone output exists
        run: |
          test -f .next/standalone/server.js || { \
            echo "::error::Build did not produce .next/standalone/server.js"; \
            exit 1; \
          }
          test -d .next/static || { \
            echo "::error::Build did not produce .next/static"; \
            exit 1; \
          }

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: |
            .next/standalone
            .next/static
            public
          if-no-files-found: error
          retention-days: 14
