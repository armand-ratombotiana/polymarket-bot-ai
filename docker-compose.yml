networks:
  bot-net:
    driver: bridge

volumes:
  bot-logs:
  bot-data:       # persists ML models & fallback state
  timescale-data: # persists TimescaleDB / PostgreSQL time-series

services:

  # ── TimescaleDB & PostgreSQL (Time-Series & Relational Engine) ────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: polymarket-timescaledb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: polymarket_secret
      POSTGRES_DB: polymarket
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - bot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Polymarket Bot (FastAPI + Supervisord + ML + Ingestion) ────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-bot:latest
    container_name: polymarket-bot
    restart: always                  # 24/7 — always restart on any failure
    env_file: .env
    environment:
      PAPER_TRADE: "true"            # safe default — override in .env
      DATABASE_URL: postgresql://postgres:polymarket_secret@timescaledb:5432/polymarket
      MODEL_PATH: /app/data/model.pkl
      LOG_LEVEL: INFO
    ports:
      - "8080:8000"                  # host:8080 → container:8000
    volumes:
      - bot-logs:/app/logs           # persisted logs
      - bot-data:/app/data           # persisted ML model & SQLite fallback
    networks:
      - bot-net
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Web UI (Next.js) ──────────────────────────────────────────────────────
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
        NEXT_PUBLIC_WS_URL:  "ws://localhost:8080/ws"
    image: polymarket-webui:latest
    container_name: polymarket-webui
    restart: always                  # 24/7
    ports:
      - "3010:3000"                  # host:3010 → container:3000
    networks:
      - bot-net
    depends_on:
      bot:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
